<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1280px;height:720px;overflow:hidden;background:white;color:black;"><style>
50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style><body>









    
    
    <title>MINUS THREE</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden
        }

        #unity-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center
        }

        canvas {
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            outline: none
        }

        #loading {
            text-align: center;
            z-index: 10
        }

        #progress-text {
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffa3;
            text-shadow: 0 0 10px rgba(0, 255, 163, 0.3)
        }

        #progress-bar {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            margin: 0 auto;
            overflow: hidden
        }

        #progress-fill {
            width: 0;
            height: 100%;
            background: #00ffa3;
            box-shadow: 0 0 15px #00ffa3;
            transition: width 0.3s ease-out
        }
    </style>



    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="loading">
            <div id="progress-text">Initializing...</div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>
    


</body></div></foreignObject></svg>