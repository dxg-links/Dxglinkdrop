  &lt;foreignObject width=&quot;100%&quot; height=&quot;100%&quot; style=&quot;width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;pointer-events:auto;&quot;&gt;
    &lt;html xmlns=&quot;http://www.w3.org/1999/xhtml&quot; lang=&quot;en&quot; style=&quot;width:100%;height:100%;margin:0;padding:0;overflow:hidden;&quot;&gt;
