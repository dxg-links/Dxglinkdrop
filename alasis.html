<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="title" content="Alasis">
<meta name="description" content="Alasis single-file endpoint loader">
<title>Alasis</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b0d12;color:#eef1f7;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0b0d12}
#app.ready{display:block}
#boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center;padding:24px}
#boot.gone{display:none}
.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{color:#9aa4b5;font-size:13.5px;letter-spacing:.2px}
.err{color:#ffb6b6;font-size:14px;max-width:520px;line-height:1.55}
.retry{margin-top:6px;padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#eef1f7;font:inherit;font-size:13.5px;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><div class="spinner"></div><div class="msg" id="bootMsg">Loading Alasis…</div></div>
<iframe id="app" title="Alasis" allow="autoplay; fullscreen; pointer-lock; gamepad; clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-orientation-lock allow-modals allow-downloads"></iframe>
<script>
(()=>{
'use strict';
// ill add more later im tired
const ENDPOINTS_B64=[
'aHR0cHM6Ly9sb2dpbi5pLXJlYWR5LmNvbS5hbGFzaXMucG9ydGFsLW5ldHdvcmsuY29t',
'aHR0cHM6Ly9hbGFzaXMuY2MuY2Qv',
'aHR0cHM6Ly9sb2dpbi5pLXJlYWR5LmNvbS5hbGFzaXMuY2MuY2Q='
];
const ENDPOINTS=ENDPOINTS_B64.map(v=>atob(v));
const CACHE_KEY='alasis_endpoint_html_cache_v1';
const boot=document.getElementById('boot');
const msg=document.getElementById('bootMsg');
const app=document.getElementById('app');
let attempt=0;

function showError(reason){
  boot.classList.remove('gone'); app.classList.remove('ready');
  boot.replaceChildren();
  const error=document.createElement('div'); error.className='err';
  error.textContent='Couldn’t load Alasis. '+reason;
  const button=document.createElement('button'); button.className='retry';
  button.textContent='Try again'; button.addEventListener('click',load);
  boot.append(error,button);
}
function inject(html,base){
  const safeBase=base.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  if(!/<base\b/i.test(html)){
    if(/<head([^>]*)>/i.test(html)) html=html.replace(/<head([^>]*)>/i,`<head$1><base href="${safeBase}">`);
    else html=`<base href="${safeBase}">`+html;
  }
  app.removeAttribute('src'); app.srcdoc=html;
  app.classList.add('ready'); boot.classList.add('gone'); document.title='Alasis';
}
function getCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch{return null}}
function setCache(value){try{localStorage.setItem(CACHE_KEY,JSON.stringify(value))}catch{}}
async function fetchEndpoint(url){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),8000);
  try{
    const response=await fetch(url,{cache:'no-store',credentials:'omit',signal:controller.signal});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const html=await response.text();
    if(!html||html.length<50) throw new Error('Empty response');
    return html;
  }finally{clearTimeout(timeout)}
}
async function refreshInBackground(startIndex){
  for(let i=startIndex;i<ENDPOINTS.length;i++){
    try{const html=await fetchEndpoint(ENDPOINTS[i]);setCache({url:ENDPOINTS[i],html});return}catch{}
  }
}
function directFallback(startIndex){
  const candidates=ENDPOINTS.slice(startIndex).concat(ENDPOINTS.slice(0,startIndex));
  let index=0, settled=false, timer;
  function tryNext(){
    if(index>=candidates.length){clearTimeout(timer);showError('All configured endpoints failed to respond.');return}
    settled=false; app.classList.remove('ready'); app.removeAttribute('srcdoc');
    app.onload=()=>{if(settled)return;settled=true;clearTimeout(timer);app.classList.add('ready');boot.classList.add('gone')};
    app.onerror=()=>{if(settled)return;settled=true;clearTimeout(timer);index++;tryNext()};
    app.src=candidates[index++];
    timer=setTimeout(()=>{if(settled)return;settled=true;tryNext()},9000);
  }
  tryNext();
}
async function load(){
  boot.classList.remove('gone');
  boot.innerHTML='<div class="spinner"></div><div class="msg" id="bootMsg">Loading Alasis…</div>';
  const currentMsg=document.getElementById('bootMsg');
  const cached=getCache();
  if(cached&&cached.html&&cached.html.length>50&&cached.url){
    inject(cached.html,cached.url);
    const index=Math.max(0,ENDPOINTS.indexOf(cached.url));
    refreshInBackground(index);
    return;
  }
  for(let i=0;i<ENDPOINTS.length;i++){
    currentMsg.textContent=i===0?'Connecting to Alasis…':`Trying alternate endpoint (${i+1}/${ENDPOINTS.length})…`;
    try{
      const html=await fetchEndpoint(ENDPOINTS[i]);
      setCache({url:ENDPOINTS[i],html}); inject(html,ENDPOINTS[i]);
      refreshInBackground((i+1)%ENDPOINTS.length); return;
    }catch{}
  }
  currentMsg.textContent='Trying direct connection…';
  directFallback(0);
}
load();
})();
</script>
</body>
</html>
